name: CI
run-name: Verify ${{ inputs.source_ref }} on Linux
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
      - name: Record verified source
        run: git rev-parse HEAD
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install verification tools
        run: |
          pip install -r requirements.txt codespell
          npm install --global oxfmt oxlint
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
          cargo install just --locked
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Source checks
        run: just style-check
      - name: Linting
        run: just lint
      - name: Spell checking
        run: just spell-check
      - name: Tests
        run: just test
      - name: Production frontend build
        run: npm run build
        working-directory: frontend
